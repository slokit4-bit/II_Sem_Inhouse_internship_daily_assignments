<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Student object
        const student = {
            name: "Rahul",
            branch: "CSE",
            cgpa: 8.4,
            city: "Jaipur"
        };

        // Print object properties
        console.log(student.name);      // Rahul
        console.log(student.branch);    // CSE
        console.log(student.cgpa);      // 8.4
        console.log(student.city);      // Jaipur

        // Print using template literal
        console.log(`${student.name} studies ${student.branch} with CGPA ${student.cgpa}`);
    </script>
</body>
</html>
