<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Landing Page</title>
    <style>
        /* --- CSS VARIABLES & BASE STYLES --- */
        :root {
            --bg-color: #78989c;
            --text-color: #000000;
            --card-bg: #f4f4f9;
            --accent-color: #4a90e2;
            --border-color: #cccccc;
        }

        /* Dark Mode overrides */
        body.dark {
            --bg-color: #1e1e24;
            --text-color: #ffffff;
            --card-bg: #000000;
            --accent-color: #ffcc00;
            --border-color: #444444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        /* --- 01. STRUCTURE (NAV & HEADING) --- */
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 600;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
        }

        .component-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        /* --- BUTTONS & INTERFACES --- */
        button {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        /* Smooth fallback for text contrast in dark mode light background button */
        body.dark button {
            color: #1e1e24;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-reset {
            background-color: #e74c3c;
            color: white !important;
            margin-left: 10px;
        }

        /* --- 04. FORM LAYOUT & ERRORS --- */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .error-message {
            color: #e74c3c;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <div class="logo"><strong>SprintDev</strong></div>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Features</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
            <button id="themeToggle">Switch to Dark Mode</button>
        </nav>
    </header>

    <main>
        <h1>Interactive Sprint Landing Page</h1>

        <section class="component-card">
            <h2>03. Click Counter</h2>
            <p>Current Count: <strong id="counterDisplay" style="font-size: 1.5rem;">0</strong></p>
            <button id="incrementBtn">Click Me!</button>
            <button id="resetBtn" class="btn-reset">Reset</button>
        </section>

        <section class="component-card">
            <h2>04. Form Validation</h2>
            <form id="signupForm" novalidate>
                <div class="form-group">
                    <label for="nameInput">Name:</label>
                    <input type="text" id="nameInput" placeholder="Enter your name">
                    <div id="nameError" class="error-message">Name cannot be empty.</div>
                </div>
                
                <div class="form-group">
                    <label for="emailInput">Email:</label>
                    <input type="email" id="emailInput" placeholder="Enter your email">
                    <div id="emailError" class="error-message">Email must contain an '@' symbol.</div>
                </div>

                <button type="submit">Submit Form</button>
            </form>
        </section>
    </main>

    <script>
        // ==========================================
        // 02. DARK MODE TOGGLE (8 Min)
        // ==========================================
        const themeToggleBtn = document.getElementById('themeToggle');
        
        themeToggleBtn.addEventListener('click', () => {
            // Adds/removes the .dark class on the <body> tag
            document.body.classList.toggle('dark');
            
            // Updates button label based on current state
            if (document.body.classList.contains('dark')) {
                themeToggleBtn.textContent = 'Switch to Light Mode';
            } else {
                themeToggleBtn.textContent = 'Switch to Dark Mode';
            }
        });

        // ==========================================
        // 03. CLICK COUNTER (7 Min)
        // ==========================================
        let count = 0;
        const counterDisplay = document.getElementById('counterDisplay');
        const incrementBtn = document.getElementById('incrementBtn');
        const resetBtn = document.getElementById('resetBtn');

        incrementBtn.addEventListener('click', () => {
            count++;
            counterDisplay.textContent = count;
        });

        resetBtn.addEventListener('click', () => {
            count = 0;
            counterDisplay.textContent = count;
        });

        // ==========================================
        // 04. FORM VALIDATION (10 Min)
        // ==========================================
        const signupForm = document.getElementById('signupForm');
        const nameInput = document.getElementById('nameInput');
        const emailInput = document.getElementById('emailInput');
        const nameError = document.getElementById('nameError');
        const emailError = document.getElementById('emailError');

        signupForm.addEventListener('submit', (event) => {
            // Prevent default form submission refreshing page
            event.preventDefault(); 
            
            let isValid = true;

            // Validate Name (not empty)
            if (nameInput.value.trim() === '') {
                nameError.style.display = 'block';
                isValid = false;
            } else {
                nameError.style.display = 'none';
            }

            // Validate Email (contains @)
            if (!emailInput.value.includes('@')) {
                emailError.style.display = 'block';
                isValid = false;
            } else {
                emailError.style.display = 'none';
            }

            // Optional alert if everything is correct
            if (isValid) {
                alert('Form submitted successfully!');
                signupForm.reset();
            }
        });
    </script>
</body>
</html>
