<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Example</title>

  <style>
    .highlight {
      background: yellow;
      padding: 5px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <h1>Hello, World!</h1>

  <script>
    // Grab an element
    const heading = document.querySelector("h1");

    // Read it
    console.log(heading.textContent);

    // Change it
    heading.textContent = "JS is live!";

    // Change its style
    heading.style.color = "#16FFBB";

    // Add a CSS class
    heading.classList.add("highlight");
  </script>

</body>
</html>
