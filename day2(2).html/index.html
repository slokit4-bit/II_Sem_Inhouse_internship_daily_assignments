<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admission Form</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-image: url("backgrond.jpeg");
            background-size: cover;
            background-position: center;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            background: #2F6F73;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }

        h2 {
            text-align: center;
            color: #c0a876;
            margin-bottom: 20px;
        }

        form {
            display: grid;
            gap: 14px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        label {
            font-weight: bold;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .checkbox {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 14px;
            margin-top: 5px;
        }

        .checkbox input {
            width: auto;
            margin-top: 3px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        button {
            cursor: pointer;
            font-weight: bold;
            border: none;
        }

        .submit-btn {
            background: #0f4c81;
            color: white;
        }

        .submit-btn:hover {
            background: #0b3b67;
        }

        .reset-btn {
            background: #e5e7eb;
            color: #333;
        }

        .reset-btn:hover {
            background: #d1d5db;
        }

        @media (max-width: 600px) {
            .row {
                grid-template-columns: 1fr;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.png" alt="College Logo" style="display: block; margin: 0 auto 20px; width: 100px;">
        <h2>College Admission Form</h2>
        <form>
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required>

            <div class="row">
                <div>
                    <label for="father">Father's Name</label>
                    <input type="text" id="father" name="father" placeholder="Enter father's name" required>
                </div>
                <div>
                    <label for="mother">Mother's Name</label>
                    <input type="text" id="mother" name="mother" placeholder="Enter mother's name" required>
                </div>
            </div>

            <div class="row">
                <div>
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" name="mobile" placeholder="Enter mobile number" required>
                </div>
                <div>
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter email address" required>
                </div>
            </div>

            <div class="row">
                <div>
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select Gender</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>
                <div>
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob" required>
                </div>
            </div>

            <div class="row">
                <div>
                    <label for="class10">Class 10 Percentage</label>
                    <input type="number" id="class10" name="class10" placeholder="e.g. 85" min="0" max="100" step="0.01" required>
                </div>
                <div>
                    <label for="class12">Class 12 Percentage</label>
                    <input type="number" id="class12" name="class12" placeholder="e.g. 90" step="0.01" required>
                </div>
            </div>

            <label for="photo">Upload Passport Size Photo</label>
            <input type="file" id="photo" name="photo" accept="image/*" required>

            <div class="checkbox">
                <input type="checkbox" id="declaration" name="declaration" required>
                <label for="declaration">I hereby declare that all the information provided by me is true and correct to the best of my knowledge.</label>
            </div>

            <div class="buttons">
                <button type="submit" class="submit-btn">Submit</button>
                <button type="reset" class="reset-btn">Reset</button>
            </div>
        </form>
    </div>
</body>
</html>
